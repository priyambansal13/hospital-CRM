packages:
  - services/*
  - libs/*

# Native Kafka client builds are never served from pnpm's side-effects cache (a truncated binary cached
# once would be reused by every later install).
sideEffectsCache: false

allowBuilds:
  '@confluentinc/kafka-javascript': true
  # their install scripts are not needed (pure JS at runtime); declined explicitly so a clean install does not stop
  '@google/genai': false
  protobufjs: false
