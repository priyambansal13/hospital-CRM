# MediCare's own console (docs/PRODUCT-MODULES-AND-PLANS.md §11). Internal: only the MediCare HQ "hospital" (slug medicare)
# has it, through the internal MEDICARE_HQ plan; it is never sold, listed or offered as an upsell. Its APIs also check
# the hospital is HQ (PLATFORM_TENANT_SLUG).
key: platform
name: Platform console
version: 2
internal: true
dependsOn: [core]
services: [subscription-service]
permissions:
  - { code: platform_console:access:tenant, description: Open the MediCare platform console }
  - { code: catalog:read:tenant, description: See the module registry, editions and plans (drafts included) }
  - { code: catalog:edit:tenant, description: Create editions, plans and draft plan versions; submit them for approval }
  - { code: catalog:approve:tenant, description: Approve or reject plan versions submitted by someone else; retire versions }
  - { code: customer:read:tenant, description: See hospitals, their contracts and the platform audit log }
  - { code: customer:manage:tenant, description: Move hospitals to a plan, add-ons and overrides }
nav:
  - { key: console-home, label: Hospitals, zone: platform, href: /platform, permissions: [platform_console:access:tenant, customer:read:tenant], audience: staff }
  - { key: console-plans, label: Plans, zone: platform, href: /platform/plans, permissions: [platform_console:access:tenant, catalog:read:tenant], audience: staff }
  - { key: console-pricebook, label: Prices, zone: platform, href: /platform/pricebook, permissions: [platform_console:access:tenant, catalog:read:tenant], audience: staff }
  - { key: console-editions, label: Editions, zone: platform, href: /platform/editions, permissions: [platform_console:access:tenant, catalog:read:tenant], audience: staff }
  - { key: console-registry, label: Modules, zone: platform, href: /platform/registry, permissions: [platform_console:access:tenant, catalog:read:tenant], audience: staff }
  - { key: console-audit, label: Audit, zone: platform, href: /platform/audit, permissions: [platform_console:access:tenant, customer:read:tenant], audience: staff }
defaultRoleGrants:
  PLATFORM_PRODUCT: [platform_console:access:tenant, catalog:read:tenant, catalog:edit:tenant, customer:read:tenant]
  PLATFORM_APPROVER: [platform_console:access:tenant, catalog:read:tenant, catalog:approve:tenant, customer:read:tenant]
  PLATFORM_SUPPORT: [platform_console:access:tenant, catalog:read:tenant, customer:read:tenant, customer:manage:tenant]
