key: home_collection
name: Home sample collection
version: 2
dependsOn: [diagnostics]
services: [diagnostics-service, billing-service, notification-service]
lifecycle: [diagnostics]
permissions:
  - { code: home_area:manage:tenant, description: Set the pincodes served for home collection, the visit fee and home collection times }
  - { code: home_visit:assign:branch, description: See home collections and assign them to phlebotomists }
  - { code: home_visit:perform:own, description: Carry out assigned home collections (on the way, arrived, collect tubes, missed) }
nav:
  - { key: lab-home-visits, label: Home collections, zone: lab, href: /lab/home, permissions: [home_visit:assign:branch], audience: staff }
  - { key: lab-my-visits, label: My visits, zone: lab, href: /lab/visits, permissions: [home_visit:perform:own], audience: staff }
  - { key: home-areas-admin, label: Home collection, zone: admin, href: /admin/home-collection, permissions: [home_area:manage:tenant, admin:access:tenant] }
defaultRoleGrants:
  # the pincodes served and the visit fee are hospital-wide (review B-4)
  BRANCH_ADMIN: [home_visit:assign:branch]
  LAB_TECH: [home_visit:assign:branch]
  PHLEBOTOMIST: [home_visit:perform:own]
