# Security scanning (review H-6): code analysis, known-vulnerable dependencies and secrets, on every change to main
# and weekly (new advisories appear without code changes).
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependencies:
    # known vulnerabilities in what the services and zones install (Trivy cannot read pnpm 10+ lockfiles; pnpm audit can)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults: { run: { working-directory: '${{ matrix.app }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: '${{ matrix.app }}/package.json' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm audit --prod --audit-level high

  secrets:
    # secrets committed by mistake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
