# Backend CI (monorepo: runs when backend/ or the shared modules change); every step is the same command used locally.
name: backend-ci
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      integration: { description: 'Also run the integration job (Docker stack, API suites, Playwright)', type: boolean, default: false }

defaults:
  run: { working-directory: backend }

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint                 # oxlint + module boundaries
      - run: pnpm typecheck
      - run: pnpm check:manifests
      - run: pnpm test                 # unit tests
      # AI evals (docs/AI-AGENTS.md §9): emergency recall 100%, unsafe answers blocked 100%, no false blocks.
      # Already part of `pnpm test`; a named step so a failing eval is visible as such.
      - name: AI safety evals
        run: pnpm --filter @mc/ai-assistant-service exec vitest run src/evals.spec.ts

  integration:
    # the whole local stack in Docker: manual for now (workflow_dispatch with integration=true)
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: platform up, bootstrap, migrate
        run: |
          node platform/scripts/mc.mjs configure
          node platform/scripts/mc.mjs infra up
          (cd backend && pnpm install --frozen-lockfile && pnpm build)
          node platform/scripts/mc.mjs configure
          node platform/scripts/mc.mjs db bootstrap
          node platform/scripts/mc.mjs migrate
          node platform/scripts/mc.mjs gateway sync
      - name: start services and seed the demo hospitals
        run: |
          for d in backend/services/*-service; do (cd $d && nohup node --import @mc/nest-common/tracing dist/main.js > /tmp/$(basename $d).log 2>&1 &); done
          sleep 15
          node platform/scripts/mc.mjs seed demo
          sleep 10
      - run: cd backend && pnpm test:integration
      # API suites (review H-6). Order matters: the leak test aims at a chat, an encounter, a lab report, a home visit,
      # a Confirm card, a pre-visit summary, a scribe draft and a membership tier that the earlier suites leave behind.
      - run: |
          set -e
          for t in assistant records documents lab results home concierge copilot scribe whatsapp memberships tenancy race queue payments reminders search plans console billing onboarding gaps wave2 wave3 wave4 wave5; do
            echo "::group::mc test $t"; node platform/scripts/mc.mjs test $t; echo "::endgroup::"
          done
      # browser journeys (Playwright): the zones built and started like production (next start), on the same stack
      - name: start the frontend zones
        run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm build
          for d in apps/zone-*; do (cd $d && nohup pnpm start > /tmp/$(basename $d).log 2>&1 &); done
          for i in $(seq 60); do curl -sf -o /dev/null http://citycare.localhost:3400/ && break; sleep 2; done
      - name: Playwright
        run: |
          cd platform && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: platform/test-results, if-no-files-found: ignore }
      - if: failure()
        run: tail -n 200 /tmp/*-service.log /tmp/zone-*.log

  list-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.ls.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: ls   # from backend/services/*/package.json "mc" metadata, never a hand-written list
        run: echo "services=$(node -e 'const fs=require(\"fs\");console.log(JSON.stringify(fs.readdirSync(\"services\").filter(d=>JSON.parse(fs.readFileSync(`services/${d}/package.json`)).mc?.kind===\"service\")))')" >> "$GITHUB_OUTPUT"

  images:
    # one image per service from the shared Dockerfile; pushed to Artifact Registry on main (Workload Identity Federation),
    # once the GCP variables are set on the repo
    needs: [checks, list-services]
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.list-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - run: |
          IMG=${{ vars.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          docker build --build-arg SERVICE=${{ matrix.service }} -t $IMG . && docker push $IMG
