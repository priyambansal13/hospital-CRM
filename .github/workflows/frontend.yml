# Frontend CI (monorepo: runs when frontend/ changes); same commands as local.
name: frontend-ci
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
defaults:
  run: { working-directory: frontend }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint          # oxlint + zone boundaries
      - run: pnpm typecheck
      - run: pnpm build
        env: { SESSION_SECRET: ci-only-not-a-secret-ci-only-not-a-secret }

  list-zones:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.ls.outputs.zones }}
    steps:
      - uses: actions/checkout@v4
      - id: ls   # from zones.json, never a hand-written list
        run: echo "zones=$(node -e 'console.log(JSON.stringify(require(\"./zones.json\").zones.map(z=>z.name)))')" >> "$GITHUB_OUTPUT"

  images:
    needs: [checks, list-zones]
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zone: ${{ fromJson(needs.list-zones.outputs.zones) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - run: |
          IMG=${{ vars.IMAGE_REGISTRY }}/zone-${{ matrix.zone }}:${{ github.sha }}
          docker build --build-arg ZONE=${{ matrix.zone }} -t $IMG . && docker push $IMG
