# OpenSearch for search-service (docs/IMPLEMENTATION-PLAN.md Phase 21): one index per hospital and kind. A single
# node is enough for staging; the indexes are a copy of the services' data and are rebuilt from them on start, so
# the volume is a cache, not a backup target. Only search-service talks to it (port 9200, cluster-internal).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels: { app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: medicare }
spec:
  replicas: 1
  serviceName: opensearch
  selector: { matchLabels: { app.kubernetes.io/name: opensearch } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: medicare }
    spec:
      securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          env:
            - { name: discovery.type, value: single-node }
            # no auth: reachable only inside the cluster (no ingress route), like clamd
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: {{ .Values.opensearch.javaOpts | quote }} }
          ports: [{ name: http, containerPort: 9200 }]
          resources:
            requests: { cpu: 250m, memory: {{ .Values.opensearch.memory }} }
            limits: { memory: {{ .Values.opensearch.memory }} }
          readinessProbe: { httpGet: { path: /_cluster/health, port: 9200 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 9200 }, initialDelaySeconds: 120, periodSeconds: 30 }
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.opensearch.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels: { app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: medicare }
spec:
  selector: { app.kubernetes.io/name: opensearch }
  ports: [{ name: http, port: 9200, targetPort: 9200 }]
