{{- if .Values.monitoring.enabled }}
# Service-level objectives and alerts (docs/OPERATIONS.md, runbooks in platform/docs/runbooks). The rules live in
# files/prometheus-rules.yaml so promtool can check and unit-test them as they are (`mc k8s check`).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: medicare-alerts
  labels: {{- toYaml .Values.monitoring.alertLabels | nindent 4 }}
spec: {{- .Files.Get "files/prometheus-rules.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
