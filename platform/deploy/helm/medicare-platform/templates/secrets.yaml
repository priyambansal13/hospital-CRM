{{- if .Values.externalSecrets.enabled }}
# Secrets come from Google Secret Manager via External Secrets Operator; nothing secret is stored in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medicare-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.store }} }
  target: { name: medicare-secrets, creationPolicy: Owner }
  data:
    {{- range (include "plat.secretKeys" . | fromJsonArray) }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ printf "%s-%s" $.Values.externalSecrets.prefix (lower . | replace "_" "-") }} }
    {{- end }}
{{- end }}
