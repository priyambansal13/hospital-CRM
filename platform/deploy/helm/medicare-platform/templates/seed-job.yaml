{{- if .Values.seedDemo }}
{{- $tenant := dict "port" 4401 }}{{- range .Values.services }}{{- if eq .schema "tenant" }}{{- $tenant = . }}{{- end }}{{- end }}
# Synthetic demo hospitals for staging (never real patient data).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo-hospitals
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: curlimages/curl:8.11.1
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom: { secretKeyRef: { name: medicare-secrets, key: INTERNAL_API_TOKEN } }
          command: ["sh", "-c"]
          args:
            - |
              for t in "citycare CityCare Clinic" "sunrise Sunrise Diagnostics"; do
                set -- $t; slug=$1; shift; name="$*"
                code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://tenant-service:{{ $tenant.port }}/internal/tenants \
                  -H "x-internal-token: $INTERNAL_API_TOKEN" -H 'content-type: application/json' \
                  -d "{\"slug\":\"$slug\",\"name\":\"$name\",\"adminEmail\":\"admin@$slug.test\"}")
                echo "$slug: $code"; [ "$code" = 201 ] || [ "$code" = 409 ] || exit 1
              done
{{- end }}
