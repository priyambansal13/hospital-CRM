{{- if and .Values.migrations .Values.schema .Values.migrationWindow.schedule }}
# Hospitals on dedicated servers (release ring 3) are migrated only in their maintenance window
# (docs/MULTI-TENANCY.md §3.4): the rollout's migration Job stops at ring 2; this runs every ring once a week.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-migrate-window
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.migrationWindow.schedule | quote }}
  timeZone: {{ .Values.migrationWindow.timeZone | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {{- include "svc.labels" . | nindent 12 }}
        spec:
          serviceAccountName: default
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: migrate
              image: {{ include "svc.image" . }}
              command: ["node", "dist/migrate.js", "all"]
              envFrom: [{ configMapRef: { name: {{ .Values.configMap }} } }]
              env:
                {{- include "svc.env" . | nindent 16 }}
                - { name: MIGRATE_MAX_RING, value: "3" }
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              securityContext: {{- include "svc.securityContext" . | nindent 16 }}
{{- end }}
