apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ .Values.name }} }
  ports: [{ name: http, port: {{ .Values.port }}, targetPort: http }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels: {{- include "svc.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
