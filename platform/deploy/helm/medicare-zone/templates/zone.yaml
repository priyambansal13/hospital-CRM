{{- $name := printf "zone-%s" .Values.zone -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: medicare, app.kubernetes.io/component: frontend }
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: medicare, app.kubernetes.io/component: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ printf "%s/%s:%s" .Values.image.registry $name .Values.image.tag | trimPrefix "/" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: {{ .Values.configMap }} } }]
          env:
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secret }}, key: SESSION_SECRET } }
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: medicare }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.cpuPercent }} } }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
