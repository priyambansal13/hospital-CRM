# One Argo CD Application per entry in deploy/environments/production/apps.json (generated by `mc k8s render production`):
# platform (wave 0) → tenant-service (wave 1) → other services (wave 2) → zones (wave 3). Each service's migration
# Job runs as a PreSync hook, so schema changes land before the new pods.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: medicare-production
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/<org>/medicare-platform.git
        revision: main
        files:
          - path: deploy/environments/production/apps.json
  template:
    metadata:
      name: 'production-{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: medicare
      source:
        repoURL: https://github.com/<org>/medicare-platform.git
        targetRevision: main
        path: 'deploy/helm/{{.chart}}'
        helm:
          valueFiles:
            - ../../environments/production/values.yaml
            - ../../environments/production/generated.yaml
          values: '{{.valuesJson}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: medicare-production
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
