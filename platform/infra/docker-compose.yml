# Local infrastructure for MediCare (platform repo).
#   node scripts/mc.mjs infra up      (or: pnpm mc infra up)
# Host ports use the 61xxx range so they don't clash with other local projects.
# Microservices (backend repo) and zones (frontend repo) run on the host; Kong reaches them via host.docker.internal.
#
# Postgres layout (docs/MULTI-TENANCY.md §3):
#   mc_control         control-plane database (tenant catalog, global identity, module registry)
#   medicare_template  template every hospital database is cloned from
#   t_<slug>           one database per hospital, one schema per service inside it
# Roles, databases and schemas are created by `mc db bootstrap`, which reads each service's package.json "mc" metadata.
name: medicare

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.7-pg18
    # tini as PID 1: otherwise postgres itself reaps healthcheck processes, and one that exits non-zero (slow
    # pg_isready under memory pressure) counts as a crashed backend → postgres restarts and drops every connection.
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/mc.mjs configure}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=128MB"]
    ports: ["61432:5432"]
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Services connect through PgBouncer (transaction pooling), exactly as in staging/production; migrations and
  # `mc db bootstrap` go to Postgres directly (61432). Config + userlist are generated by `mc configure`.
  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:latest
    entrypoint: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    ports: ["61643:6432"]
    volumes: ["./pgbouncer/generated:/etc/pgbouncer:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:8.8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run node scripts/mc.mjs configure}", "--appendonly", "yes"]
    ports: ["61379:6379"]
    volumes: [redis_data:/data]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    <<: *restart
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.17
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:61092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --default-log-level=warn
    ports: ["61092:19092", "61081:18081"]
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    <<: *restart
    profiles: [tools]
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ["61080:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run node scripts/mc.mjs configure}
      KC_HEALTH_ENABLED: "true"
      MC_IAM_CLIENT_SECRET: ${MC_IAM_CLIENT_SECRET:?run node scripts/mc.mjs configure}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:61180
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports: ["61180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  kong:
    <<: *restart
    image: kong:3.9.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_NGINX_WORKER_PROCESSES: "1"
      # the zones run on the host and forward the browser's address (review B-7); Kong sets X-Real-IP from it
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_MEM_CACHE_SIZE: 64m
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["61000:8000", "61001:8001"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./kong:/kong:ro"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *restart
    image: cgr.dev/chainguard/minio
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run node scripts/mc.mjs configure}
    ports: ["61900:9000", "61901:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Search (Phase 21): single node, no security plugin locally (managed OpenSearch with auth in staging/production)
  opensearch:
    <<: *restart
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports: ["61920:9200"]
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Real virus scanning (optional locally: ~1.3 GB RAM, downloads signatures on first start):
  #   docker compose --profile scan up -d clamav   and set VIRUS_SCANNER=clamav in backend/.env
  clamav:
    profiles: [scan]
    image: clamav/clamav:stable
    ports: ["61310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31
    ports: ["61825:8025", "61025:1025"]

volumes:
  opensearch_data:
  pg_data:
  redis_data:
  redpanda_data:
  keycloak_data:
  minio_data:
